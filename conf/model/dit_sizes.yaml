# @package _global_
# Standard Diffusion Transformer (DiT) model sizes
# Based on DiT paper (Peebles & Xie, 2023) and RAE paper for head configurations

# Model size selection: S, B, L, or XL
model_size: B

# Head size selection for latent models (if not void, use 'G' for RAE paper recommendation)
model_head_size: V # options: V (void), B, H, G, T

# Standard DiT architecture sizes
dit_sizes:
  XXS:  # Extra extra Small
    hidden_size: 32
    num_hidden_layers: 4
    num_attention_heads: 2
    cond_hidden_size: 16
  XS:  # Extra Small
    hidden_size: 64
    num_hidden_layers: 4
    num_attention_heads: 4
    cond_hidden_size: 32
  S:  # Small - ~33M params (DiT backbone only)
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    cond_hidden_size: 128
  B:  # Base - ~130M params (DiT backbone only)
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 12
    cond_hidden_size: 128
  BL: # Custom size for ablation studies
    hidden_size: 1024
    num_hidden_layers: 13
    num_attention_heads: 16
    cond_hidden_size: 256
  L:  # Large - ~458M params (DiT backbone only)
    hidden_size: 1024
    num_hidden_layers: 24
    num_attention_heads: 16
    cond_hidden_size: 256
  XL:  # Extra Large - ~675M params (DiT backbone only)
    hidden_size: 1152
    num_hidden_layers: 28
    num_attention_heads: 16
    cond_hidden_size: 256
  XXL:
    hidden_size: 1280
    num_hidden_layers: 32
    num_attention_heads: 16
    cond_hidden_size: 256
  H:
    hidden_size: 1536
    num_hidden_layers: 32
    num_attention_heads: 16
    cond_hidden_size: 256
  G:
    hidden_size: 2048
    num_hidden_layers: 40
    num_attention_heads: 16
    cond_hidden_size: 256
  T:
    hidden_size: 2688
    num_hidden_layers: 40
    num_attention_heads: 21
    cond_hidden_size: 256

# Head configurations for latent models (based on RAE paper)
# RAE paper finding: Wide and shallow heads (2-layer, 2048-dim 'G' head) are most effective
# "A 2-layer, 2048-dim (G) head outperforms a 6-layer, 1152-dim (XL) head by a large margin"
# All heads use 2 layers (wide and shallow design)
dit_head_sizes:
  V: # void
    hidden_size: null
    num_layers: null
    num_attention_heads: null
  B:  # Base head (768-dim, 2-layer)
    hidden_size: 768
    num_layers: 2
    num_attention_heads: 12  # 768 / 64 = 12 heads
  H:  # Large head (1536-dim, 2-layer)
    hidden_size: 1536
    num_layers: 2
    num_attention_heads: 16
  G:  # Giant head (2048-dim, 2-layer) - RAE paper default recommendation
    hidden_size: 2048
    num_layers: 2
    num_attention_heads: 16
  T:  # Tremendous head (2688-dim, 2-layer)
    hidden_size: 2688
    num_layers: 2
    num_attention_heads: 21

# Encoder sizes (can be same as main model or smaller)
# By default, use same architecture as main model
encoder_sizes: ${dit_sizes}


  
# Select sizes based on model_size
dit_hidden_size: ${dit_sizes.${model_size}.hidden_size}
dit_num_hidden_layers: ${dit_sizes.${model_size}.num_hidden_layers}
dit_num_attention_heads: ${dit_sizes.${model_size}.num_attention_heads}
dit_cond_hidden_size: ${dit_sizes.${model_size}.cond_hidden_size}

# Encoder sizes
encoder_hidden_size: ${encoder_sizes.${model_size}.hidden_size}
encoder_num_hidden_layers: ${encoder_sizes.${model_size}.num_hidden_layers}
encoder_num_attention_heads: ${encoder_sizes.${model_size}.num_attention_heads}
encoder_cond_hidden_size: ${encoder_sizes.${model_size}.cond_hidden_size}

# Head sizes (for latent models) - use model_head_size to select
# These can be set to null for encoders that don't use heads (e.g., DiT encoder)
dit_head_hidden_size: ${dit_head_sizes.${model_head_size}.hidden_size}
dit_head_num_layers: ${dit_head_sizes.${model_head_size}.num_layers}
dit_head_num_attention_heads: ${dit_head_sizes.${model_head_size}.num_attention_heads}