# @package _global_

dataset_name: zinc250k
data_dir: data/molecules

node_vocab_size: 9
edge_vocab_size: 4
node_mask_token_id: ${node_vocab_size}
edge_mask_token_id: ${edge_vocab_size}
max_nodes: 38
latent_len: 32

num_gpu_devices: 1
batch_size: ${eval:"256 // ${num_gpu_devices}"}
eval_batch_size: ${batch_size}
num_workers: 4

data:
  target: dlm.data.molecules.MoleculeDataModule
  params:
    data_dir: ${data_dir}
    dataset_name: ${dataset_name}
    batch_size: ${batch_size}
    eval_batch_size: ${eval_batch_size}
    num_workers: ${num_workers}
    regenerate: false
    return_smiles: true
