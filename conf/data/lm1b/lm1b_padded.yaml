# @package _global_

# Dataset parameters
vocab_size: 50257
sequence_length: 128
mask_token_id: 50257

# DataLoader/hardware
num_gpu_devices: 4
batch_size: 16
eval_batch_size: 16
num_workers: 8

precomputed_latents_path: null

data:
  target: dlm.data.base.DataModuleForPT
  params:
    tokenizer_config:
      target: transformers.AutoTokenizer
      params:
        pretrained_model_name_or_path: gpt2
        padding_side: right
        pad_token: <|endoftext|>
        mask_token: <|mask|>
        bos_token: <|endoftext|>    # NEW: needed because DataModuleForPT uses bos/eos in grouping
        eos_token: <|endoftext|>    # NEW: make explicit
    data_config:
      target: datasets.load_dataset
      params:
        path: lm1b
        trust_remote_code: true
        # split: "train[:10%]"
    save_dir: data/lm1b_padded     # CHANGED: separate cache dir from OWT
    max_length: ${sequence_length}
    val_split: test                # CHANGED: use LM1B test split for validation
    # val_size: 100_000            # REMOVED: not needed when using val_split
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    num_proc: ${eval:"len(__import__('os').sched_getaffinity(0))"}
    precomputed_latents_path: ${precomputed_latents_path}
    pack_sequences: false
