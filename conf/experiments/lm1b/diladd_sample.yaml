# @package _global_

defaults:
  - _sample_common
  - _diladd_common
  - _self_

experiment_name: lm1b_diladd
variant_name: diladd_lat128_cb512_dim32

group: diladd_sampling
postfix: _${variant_name}_temp${temperature}

num_inference_steps: [1, 2, 4, 8, 16, 32, 64, 128]

