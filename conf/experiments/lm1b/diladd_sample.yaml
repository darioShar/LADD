sample_root_dir: logs/models/lm1b/sampling/diladd
sample_log_dir: ${sample_root_dir}/temperature_${temperature}_diladd_${encoder_type}_${model_size}_${codebook_size}_${vqvae_latent_dim}_${latent_sequence_length}
