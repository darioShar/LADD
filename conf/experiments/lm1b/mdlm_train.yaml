# @package _global_

defaults:
  - _train_common
  - override /base: mdlm
  - override /data: lm1b/lm1b_qwen_packed
  - override /model: lm1b/mdlm
  - _self_

experiment_name: lm1b_mdlm
variant_name: mdlm_bl

group: ${core_model}
postfix: _${core_model}

core_model: MDLM
model_size: BL
num_inference_steps: ${sequence_length}
use_data_loss_elbo: false
use_data_loss_elbo_label: 'false'
torch_compile: max-autotune-no-cudagraphs

log_dir: logs/models/lm1b/pack_elbo_${use_data_loss_elbo_label}_mdlm_lm1b_${model_size}
