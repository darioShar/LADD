# @package _global_

defaults:
  - _sample_common
  - _diladd_common
  - _self_

experiment_name: text8_diladd
variant_name: diladd_mask_050_lat16_cb4096_dim128

group: ${core_model}_sampling
postfix: _sample_${variant_name}

training_stage: 1
freeze_encoder: false
p_mask_input_enc: 0.5
use_encoder_latent_sampling: true
use_precomputed_latent_sampling: false
num_inference_steps_latent: ${num_inference_steps}
eval_and_log_first_n_batches: 4
limit_eval_batch_size: 100

run_name: only_mask_input_${p_mask_input_enc}_lddm_${model_size}_${codebook_size}_${vqvae_latent_dim}_${latent_sequence_length}_${y_noise_schedule}
train_log_dir: logs/models/text8/${run_name}
sample_log_dir: logs/models/text8/sampling_experiments/${variant_name}

model:
  params:
    limit_eval_batch_size: ${limit_eval_batch_size}
