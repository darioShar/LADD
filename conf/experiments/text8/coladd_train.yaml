# @package _global_

defaults:
  - _train_common
  - _coladd_common
  - _self_

experiment_name: text8_coladd
variant_name: coladd_all_zero_no_rope

group: ${core_model}
postfix: _${core_model}

kl_regularization_weight: 0.0
latent_strategy:
  variance: null
  fixed_sigma_latent: 0.0
latent_loss_weight_schedule: delayed_warmup
latent_loss_weight_schedule_steps: 10000
data_loss_weight_stage_2: 1.0
latent_loss_weight_stage_2: 1.0
use_data_loss_elbo: false
use_latent_loss_elbo: false
p_cfg: 0.0
use_p_r: false
conditional_independence_loss: false
use_infonce_loss: false
infonce_weight: 1.0
infonce_temperature: 0.1
p_mask_input_enc: 0.1
use_precomputed_latent_train_val: false
use_encoder_supervision: false
num_inference_steps: ${sequence_length}
num_inference_steps_latent: ${num_inference_steps}

log_dir: logs/models/text8/all_zero_no_rope_lddm_${core_model}

lightning:
  trainer:
    val_check_interval: 10000

model:
  params:
    eval_and_log_first_n_batches: 4
