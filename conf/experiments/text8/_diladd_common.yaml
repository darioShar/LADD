# @package _global_

defaults:
  - override /base: diladd
  - override /data: text8/text8
  - override /model: text8/diladd
  - _self_

core_model: FUJI
model_size: B
normalize_embeddings: true
encoder_strategy: vqvae
independent_timesteps: true
vqvae_latent_dim: 128
commitment_cost: 0.25
vqvae_use_ema: true
vqvae_ema_decay: 0.95
use_cosine_sim: true
threshold_ema_dead_code: 2
latent_sequence_length: 16
codebook_size: 4096
y_noise_schedule: polynomial
use_rope_for_latents: true
SEQ: true
